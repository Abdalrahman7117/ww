<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>    </title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:30px;

    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fecfef
    );

    font-family:Arial,sans-serif;
}

.heart{
    position:relative;
    width:120px;
    height:120px;
    background:#ff1744;
    transform:rotate(-45deg);
    animation:beat 1s infinite;
}

.heart::before,
.heart::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:#ff1744;
    border-radius:50%;
}

.heart::before{
    top:-60px;
    left:0;
}

.heart::after{
    left:60px;
    top:0;
}

@keyframes beat{
    0%{
        transform:rotate(-45deg) scale(1);
    }

    25%{
        transform:rotate(-45deg) scale(1.15);
    }

    50%{
        transform:rotate(-45deg) scale(1);
    }

    75%{
        transform:rotate(-45deg) scale(1.15);
    }

    100%{
        transform:rotate(-45deg) scale(1);
    }
}

h1{
    color:white;
    text-shadow:0 3px 10px rgba(0,0,0,.2);
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:white;
    color:#ff1744;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

</style>
</head>

<body>

<div class="heart"></div>

<h1>    </h1>

<button onclick="window.location.href='page2.html'">
         Start    
</button>

</body>
</html>
